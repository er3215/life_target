  <text x="600" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1F2B3D">人生成就與里程碑日誌</text>
  <text x="600" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748B">設定你想完成目標的目標歲數，把時間變成實現夢想的倒數。</text>

