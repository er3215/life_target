  <text x="660" y="470" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1F2B3D">39.6%</text>

  <text x="145" y="560" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3a4a5d">當前歲數</text>
